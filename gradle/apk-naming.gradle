// The installed version, APK name and GitHub release all share one release counter.
// Keep each versionName component within the limits supported by existing updaters.
ext.dailyPauseReleaseVersion = { Object value ->
    String code = value?.toString()?.trim()
    if (code == null || !(code ==~ /[1-9][0-9]{0,4}/))
        throw new IllegalArgumentException('releaseCode must be an integer from 1 to 99999')
    String name = "1.${code}.0"
    [versionCode: code.toInteger(), versionName: name,
     apkFileName: "Daily-Pause-v${name}.apk".toString(),
     tag: "v${name}".toString(), title: "Daily Pause ${name}".toString()].asImmutable()
}
