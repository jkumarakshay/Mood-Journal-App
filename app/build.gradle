plugins { id 'com.android.application' }

apply from: rootProject.file('gradle/apk-naming.gradle')
def releaseProperties = new Properties()
rootProject.file('version.properties').withInputStream { releaseProperties.load(it) }
def releaseVersion = project.ext.dailyPauseReleaseVersion(releaseProperties.getProperty('releaseCode'))

android {
    namespace 'com.moodjournal.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.moodjournal.app'
        minSdk 26
        targetSdk 35
        versionCode releaseVersion.versionCode
        versionName releaseVersion.versionName
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing is an explicit, separate step; never fall back to a debug key here.
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { maxHeapSize = '2g' }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = releaseVersion.apkFileName
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
