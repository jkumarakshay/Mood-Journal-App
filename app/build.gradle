plugins { id 'com.android.application' }

apply from: rootProject.file('gradle/apk-naming.gradle')
def resolveApkName = project.ext.dailyPauseApkName
def apkFileName = providers.provider {
    def overrides = ['apkBranch', 'apkCommitCount', 'apkMainRef', 'apkMainCommitCount', 'apkBranchCommitCount']
            .collectEntries { key -> [(key): providers.gradleProperty(key).orNull] }
    resolveApkName(overrides, { List arguments ->
        providers.exec {
            workingDir rootProject.projectDir
            commandLine(['git'] + arguments)
        }.standardOutput.asText.get().trim()
    })
}

android {
    namespace 'com.moodjournal.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.moodjournal.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = apkFileName.get()
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
